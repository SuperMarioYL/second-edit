<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="hero-dark-title hero-dark-desc" data-palette="second-edit">
<title id="hero-dark-title">second-edit: region-locked edits for generated game art</title>
<desc id="hero-dark-desc">Particles converge on a sprite grid and a receipt card reading changed 476 px, untouched sha unchanged, pivot ok, collision ok, atlas unchanged.</desc>
<style>
  text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .p { animation: converge 6s ease-in-out infinite; transform-box: fill-box; }
  @keyframes converge {
    0% { transform: translate(-80px, 26px); opacity: 0; }
    55% { opacity: .9; }
    100% { transform: translate(0, 0); opacity: .55; }
  }
  .flow { stroke-dasharray: 5 11; animation: dash 2.6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -64; } }
  .breathe { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .p, .flow, .breathe { animation: none; opacity: 1; }
  }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#131B2C" stroke-width="1"/>
  </pattern>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#5BE1FF" stop-opacity=".30"/>
    <stop offset="100%" stop-color="#5BE1FF" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1200" height="500" fill="#080B16"/>
<rect width="1200" height="500" fill="url(#grid)" opacity=".55"/>
<circle cx="946" cy="226" r="190" fill="url(#halo)"/>
<text x="64" y="64" fill="#5BE1FF" font-size="14" letter-spacing="3" class="mono">ASSET EDIT CONTRACT</text>
<text x="64" y="112" fill="#E9EFFA" font-size="32" font-weight="700">second-edit</text>
<text x="64" y="146" fill="#93A2BA" font-size="16">An edit verb for generated game art</text>

<text x="64" y="212" fill="#E9EFFA" font-size="21" font-weight="600">Change one named region.</text>
<text x="64" y="244" fill="#E9EFFA" font-size="21" font-weight="600">Prove every other pixel.</text>
<text x="64" y="292" fill="#93A2BA" font-size="15">A patch in. A checked PNG, an updated sidecar</text>
<text x="64" y="316" fill="#93A2BA" font-size="15">and a chained receipt out — or nothing at all.</text>
