<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="architecture-light-title architecture-light-desc" data-palette="5be1ff-8b7bff-9bf0ff-e0921e65014f">
<title id="architecture-light-title">second-edit architecture: one binary, five packages</title>
<desc id="architecture-light-desc">Layered diagram: cmd/second-edit over internal/contract, internal/edit, internal/engine/godot and internal/receipt with the init and apply flows.</desc>
<style>
  text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .p { animation: converge 6s ease-in-out infinite; transform-box: fill-box; }
  @keyframes converge {
    0% { transform: translate(-80px, 26px); opacity: 0; }
    55% { opacity: .9; }
    100% { transform: translate(0, 0); opacity: .55; }
  }
  .flow { stroke-dasharray: 5 11; animation: dash 2.6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -64; } }
  .breathe { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .p, .flow, .breathe { animation: none; opacity: 1; }
  }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#E2E9F4" stroke-width="1"/>
  </pattern>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0B7FA8" stop-opacity=".30"/>
    <stop offset="100%" stop-color="#0B7FA8" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1200" height="560" fill="#F4F7FC"/>
<rect width="1200" height="560" fill="url(#grid)" opacity=".55"/>
<text x="64" y="64" fill="#0B7FA8" font-size="14" letter-spacing="3" class="mono">ARCHITECTURE</text>
<text x="64" y="112" fill="#0F1728" font-size="32" font-weight="700">One binary, five packages, no daemon</text>
<text x="64" y="146" fill="#55637C" font-size="16">Nothing is generated here: a patch arrives, a verdict leaves.</text>

<g>
  <rect x="96" y="196" width="1008" height="50" rx="8" fill="#FFFFFF" stroke="#D3DCEA"/>
  <rect x="96" y="196" width="4" height="50" rx="2" fill="#0B7FA8" opacity="0.9"/>
  <text x="120" y="227" fill="#0F1728" font-size="15" class="mono">cmd/second-edit</text>
  <text x="380" y="227" fill="#55637C" font-size="13.5">init · apply · check · version — exit 0 / 1 / 2</text>
</g><path d="M600 246 V258" stroke="#D3DCEA" stroke-width="2"/><g>
  <rect x="96" y="258" width="1008" height="50" rx="8" fill="#FFFFFF" stroke="#D3DCEA"/>
  <rect x="96" y="258" width="4" height="50" rx="2" fill="#0B7FA8" opacity="0.35"/>
  <text x="120" y="289" fill="#0F1728" font-size="15" class="mono">internal/contract</text>
  <text x="380" y="289" fill="#55637C" font-size="13.5">sidecar schema v1 · source hash · region lookup</text>
</g><path d="M600 308 V320" stroke="#D3DCEA" stroke-width="2"/><g>
  <rect x="96" y="320" width="1008" height="50" rx="8" fill="#FFFFFF" stroke="#D3DCEA"/>
  <rect x="96" y="320" width="4" height="50" rx="2" fill="#0B7FA8" opacity="0.35"/>
  <text x="120" y="351" fill="#0F1728" font-size="15" class="mono">internal/edit</text>
  <text x="380" y="351" fill="#55637C" font-size="13.5">mask rasterization · composite · complement hash</text>
</g><path d="M600 370 V382" stroke="#D3DCEA" stroke-width="2"/><g>
  <rect x="96" y="382" width="1008" height="50" rx="8" fill="#FFFFFF" stroke="#D3DCEA"/>
  <rect x="96" y="382" width="4" height="50" rx="2" fill="#0B7FA8" opacity="0.35"/>
  <text x="120" y="413" fill="#0F1728" font-size="15" class="mono">internal/engine/godot</text>
  <text x="380" y="413" fill="#55637C" font-size="13.5">Sprite2D · AtlasTexture · CollisionPolygon2D → checks</text>
</g><path d="M600 432 V444" stroke="#D3DCEA" stroke-width="2"/><g>
  <rect x="96" y="444" width="1008" height="50" rx="8" fill="#FFFFFF" stroke="#D3DCEA"/>
  <rect x="96" y="444" width="4" height="50" rx="2" fill="#0B7FA8" opacity="0.35"/>
  <text x="120" y="475" fill="#0F1728" font-size="15" class="mono">internal/receipt</text>
  <text x="380" y="475" fill="#55637C" font-size="13.5">schema v1 · chain · human lines</text>
</g>
<line x1="96" y1="160" x2="1104" y2="160" stroke="#D3DCEA"/>
<text x="96" y="532" fill="#55637C" font-size="12.5" class="mono">flow:</text>
<text x="142" y="532" fill="#0F1728" font-size="12.5" class="mono">init(source, scene) → contract</text>
<text x="572" y="532" fill="#0F1728" font-size="12.5" class="mono">apply(contract, region, patch) → verify → write | reject</text>

</svg>
